<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الطلبات والفواتير | Event QR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --deep-black: #080808;
            --charcoal-card: #121212;
            --soft-black-field: #1A1A1A;
            --surface-light: #222222;
            --luxury-gold: #C6A769;
            --luxury-gold-soft: #B8955A;
            --luxury-gold-glow: rgba(198, 167, 105, 0.12);
            --text-pure-light: #F6F1E8;
            --text-ivory: #EAE3D9;
            --text-muted-beige: #B0A79C;
            --luxury-red: #9E3D3D;
            --luxury-green: #4D7C5F;
            --border-color: rgba(198, 167, 105, 0.15);
            --shadow-lg: 0 30px 60px rgba(0, 0, 0, 0.6);
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            --border-radius: 8px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        .hidden { display: none !important; }
        html { scroll-behavior: smooth; }
        
        body {
            background-color: var(--deep-black);
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
            color: var(--text-ivory);
            font-family: 'Tajawal', sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }
        body, button, input, textarea, select {
            font-family: 'Tajawal', sans-serif !important;
        }

        /* Navbar */
        .navbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: rgba(15, 15, 15, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
            height: 64px;
        }
        .nav-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 24px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo {
            font-family: 'Tajawal', sans-serif !important;
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--luxury-gold);
            letter-spacing: 0;
        }
        .nav-brand-actions {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            justify-content: center;
        }
        .archive-nav-btn {
            width: 150px;
            padding: 9px 18px;
            font-size: 0.85rem;
            min-height: 40px;
        }

        /* Main */
        .main-wrapper {
            max-width: 1100px;
            margin: 0 auto;
            padding: 100px 24px 60px;
            display: block;
        }

        .section-title {
            font-family: 'Tajawal', sans-serif;
            font-size: 1.8rem;
            color: var(--luxury-gold);
            margin-bottom: 24px;
            font-weight: 800;
        }

        /* Input Card */
        .input-card {
            background: var(--charcoal-card);
            border-radius: var(--border-radius);
            padding: 40px;
            border: 1.5px solid var(--border-color);
            box-shadow: var(--shadow-lg);
            position: sticky;
            top: 90px;
        }

        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: var(--text-muted-beige);
            font-weight: 500;
        }
        .form-group textarea {
            width: 100%;
            min-height: 280px;
            padding: 16px;
            border: 1.5px solid var(--border-color);
            border-radius: var(--border-radius);
            background: var(--soft-black-field);
            color: var(--text-ivory);
            font-family: 'Tajawal', sans-serif;
            font-size: 0.95rem;
            line-height: 1.8;
            transition: var(--transition);
            outline: none;
            resize: vertical;
            direction: rtl;
        }
        .form-group textarea:focus {
            border-color: var(--luxury-gold);
            box-shadow: 0 0 0 4px var(--luxury-gold-glow);
        }
        .form-group textarea::placeholder {
            color: var(--text-muted-beige);
            opacity: 0.6;
        }

        .hint-box {
            background: rgba(198, 167, 105, 0.05);
            border: 1.5px solid var(--border-color);
            border-radius: var(--border-radius);
            padding: 16px;
            margin-bottom: 20px;
            font-size: 0.82rem;
            color: var(--text-muted-beige);
            line-height: 1.8;
        }
        .hint-box strong { color: var(--luxury-gold); }
        .hint-box code {
            background: rgba(198, 167, 105, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: inherit;
            color: var(--text-ivory);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 32px;
            border-radius: var(--border-radius);
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: var(--transition);
            font-family: inherit;
            letter-spacing: 0;
            text-transform: none;
            gap: 8px;
        }
        .btn-primary {
            background: var(--luxury-gold);
            color: #000;
            box-shadow: 0 10px 30px rgba(198, 167, 105, 0.2);
            width: 100%;
        }
        .btn-primary:hover {
            background: var(--luxury-gold-soft);
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(198, 167, 105, 0.3);
        }
        .btn-secondary {
            background: transparent;
            color: var(--luxury-gold);
            border: 1.5px solid var(--luxury-gold);
            width: 100%;
        }
        .btn-secondary:hover {
            background: var(--luxury-gold);
            color: #000;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        /* Preview */
        .preview-section { display: flex; flex-direction: column; gap: 20px; width: min(700px, 100%); margin: 0 auto; }
        .invoice-container {
            background: #fff;
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            border: 1.5px solid var(--border-color);
        }

        /* Invoice Inner - ALL Arabic text uses Tajawal */
        .invoice-inner {
            padding: 50px 45px;
            color: #1a1a1a;
            font-family: 'Tajawal', sans-serif !important;
            background: #fff;
            position: relative;
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            direction: rtl;
            unicode-bidi: isolate;
            text-rendering: geometricPrecision;
        }
        .invoice-inner * {
            font-family: 'Tajawal', sans-serif !important;
            letter-spacing: 0 !important;
            text-transform: none !important;
        }
        .invoice-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 40px;
            padding-bottom: 25px;
            border-bottom: 2px solid #f0f0f0;
        }
        .invoice-brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .invoice-brand-icon {
            width: 50px; height: 50px;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
            flex: 0 0 auto;
        }
        .invoice-brand-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        .invoice-brand-text h2 {
            font-family: 'Tajawal', sans-serif;
            font-size: 1.3rem; color: #1a1a1a;
            font-weight: 800; margin-bottom: 2px;
        }
        .invoice-brand-text span {
            font-family: 'Tajawal', sans-serif;
            font-size: 0.78rem; color: #888; font-weight: 400;
        }
        .invoice-meta { text-align: left; }
        .invoice-meta .label {
            font-family: 'Tajawal', sans-serif !important;
            font-size: 0.72rem; color: #999;
            text-transform: none; letter-spacing: 0;
            margin-bottom: 4px;
        }
        .invoice-meta .value {
            font-family: 'Tajawal', sans-serif;
            font-size: 1.05rem; font-weight: 800;
            color: #1a1a1a;
        }
        .invoice-title {
            text-align: center; margin-bottom: 35px;
        }
        .invoice-title h1 {
            font-family: 'Tajawal', sans-serif !important;
            font-size: 1.9rem; color: #1a1a1a;
            font-weight: 800; margin-bottom: 6px; letter-spacing: 0;
        }
        .invoice-title .subtitle {
            font-family: 'Tajawal', sans-serif;
            font-size: 0.88rem; color: #999;
        }

        .invoice-table {
            width: 100%; border-collapse: collapse; margin-bottom: 30px;
        }
        .invoice-table thead th {
            background: linear-gradient(135deg, #f8f5f0 0%, #f0ebe3 100%);
            padding: 14px 16px; text-align: right;
            font-family: 'Tajawal', sans-serif !important;
            font-size: 0.78rem; font-weight: 800;
            color: #666; letter-spacing: 0;
            border-bottom: 2px solid #e0d5c5;
        }
        .invoice-table tbody td {
            padding: 16px; border-bottom: 1px solid #f0f0f0;
            font-family: 'Tajawal', sans-serif;
            font-size: 0.95rem; color: #333; vertical-align: top;
        }
        .invoice-table tbody tr:last-child td { border-bottom: 2px solid #e0d5c5; }
        .invoice-table .field-label {
            font-family: 'Tajawal', sans-serif;
            font-weight: 800; color: #1a1a1a;
            white-space: nowrap; width: 35%;
        }
        .invoice-table .field-value {
            font-family: 'Tajawal', sans-serif;
            color: #555;
            direction: rtl;
            unicode-bidi: plaintext;
            text-align: right;
            line-height: 1.8;
            word-break: break-word;
        }
        .invoice-table .customer-value {
            direction: rtl !important;
            unicode-bidi: isolate !important;
            text-align: right !important;
            color: #333;
            font-weight: 500;
        }
        .invoice-table .field-value .color-preview {
            display: inline-flex; align-items: center; gap: 10px;
        }
        .invoice-table .field-value .color-dot {
            width: 24px; height: 24px; border-radius: 50%;
            border: 2px solid #ddd; display: inline-block;
        }

        .invoice-total {
            background: linear-gradient(135deg, #f8f5f0 0%, #f0ebe3 100%);
            border-radius: 10px; padding: 25px 30px;
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 30px; border: 1px solid #e0d5c5;
        }
        .invoice-total .total-label {
            font-family: 'Tajawal', sans-serif !important;
            font-size: 0.95rem; font-weight: 800;
            color: #666; letter-spacing: 0;
        }
        .invoice-total .total-value {
            font-family: 'Tajawal', sans-serif;
            font-size: 2rem; font-weight: 800; color: #1a1a1a;
            display: flex; align-items: baseline; gap: 8px;
        }
        .invoice-total .total-value .currency {
            font-family: 'Tajawal', sans-serif;
            font-size: 0.95rem; color: #999; font-weight: 500;
        }

        .invoice-footer {
            text-align: center; padding-top: 20px;
            border-top: 1px solid #f0f0f0;
        }
        .invoice-footer p {
            font-family: 'Tajawal', sans-serif;
            font-size: 0.78rem; color: #aaa; margin-bottom: 4px;
        }
        .invoice-footer .contact-info {
            display: flex; justify-content: center; gap: 24px;
            margin-top: 10px;
            font-family: 'Tajawal', sans-serif;
            font-size: 0.78rem; color: #888;
            flex-wrap: wrap;
        }

        .invoice-watermark {
            position: absolute; bottom: 80px; left: 50%;
            transform: translateX(-50%) rotate(-15deg);
            font-family: 'Tajawal', sans-serif;
            font-size: 5rem; color: rgba(198, 167, 105, 0.06);
            font-weight: 900; pointer-events: none;
            user-select: none; white-space: nowrap;
        }

        .actions-bar { display: flex; gap: 12px; }
        .actions-bar .btn { flex: 1; }

        .empty-state {
            text-align: center; padding: 60px 20px;
            color: var(--text-muted-beige);
        }
        .empty-state svg {
            width: 64px; height: 64px;
            margin-bottom: 20px; opacity: 0.3;
        }
        .empty-state h3 {
            font-size: 1.2rem; margin-bottom: 8px;
            color: var(--text-ivory);
        }

        .status-badge {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 4px 12px; border-radius: 20px;
            font-size: 0.8rem; font-weight: 800;
        }
        .status-paid { background: #e8f5e9; color: #2e7d32; }
        .status-pending { background: #fff3e0; color: #ef6c00; }

        .toast {
            position: fixed; bottom: 30px; left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--charcoal-card); color: var(--luxury-gold);
            padding: 16px 32px; border-radius: var(--border-radius);
            border: 1.5px solid var(--luxury-gold);
            font-weight: 700; z-index: 9999; opacity: 0;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .toast.show {
            transform: translateX(-50%) translateY(0); opacity: 1;
        }
        .admin-login {
            position: fixed; inset: 0; z-index: 10000; display: grid; place-items: center;
            padding: 20px; background: rgba(0,0,0,.94); backdrop-filter: blur(8px);
        }
        .admin-login.hidden { display: none; }
        .admin-login-card {
            width: min(460px, 100%); padding: 32px; border: 1.5px solid var(--luxury-gold);
            border-radius: var(--border-radius); background: var(--charcoal-card); box-shadow: var(--shadow-lg);
        }
        .admin-login-card h2 { color: var(--luxury-gold); margin-bottom: 8px; }
        .admin-login-card p { color: var(--text-muted-beige); margin-bottom: 20px; }
        .admin-login-card form { display: grid; gap: 12px; }
        .admin-login-card input {
            width: 100%; padding: 14px; border: 1.5px solid var(--border-color); border-radius: var(--border-radius);
            background: var(--soft-black-field); color: var(--text-ivory); font: inherit;
        }
        .admin-login-message { min-height: 24px; margin-top: 14px; color: var(--luxury-gold); }
        .admin-login-message.error { color: #ef9a9a; }

        .archive-modal {
            position: fixed;
            inset: 0;
            z-index: 5000;
            display: none;
            background: rgba(8, 8, 8, 0.98);
            color: var(--text-ivory);
            direction: rtl;
            overflow-y: auto;
            padding: 34px 24px;
        }
        .archive-modal.open {
            display: block;
        }
        .archive-home {
            position: static;
            display: block;
            overflow: visible;
            padding: 0;
            background: transparent;
        }
        .archive-home .archive-modal-content {
            max-width: 1100px;
            min-height: 0;
            padding: 0;
            background: transparent;
            border: none;
            border-radius: 0;
            box-shadow: none;
        }
        .invoice-modal {
            position: fixed;
            inset: 0;
            z-index: 6000;
            display: none;
            overflow-y: auto;
            padding: 24px;
            background: rgba(8, 8, 8, 0.97);
            backdrop-filter: blur(8px);
        }
        .invoice-modal.open {
            display: block;
        }
        .invoice-modal-content {
            width: min(760px, 100%);
            margin: 0 auto;
        }
        .invoice-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 12px 0 16px;
        }
        .invoice-modal-title {
            color: var(--luxury-gold);
            font-size: 1.45rem;
            font-weight: 800;
        }
        .invoice-modal-close {
            width: 42px;
            height: 42px;
            min-height: 42px;
            padding: 0;
            font-size: 1.35rem;
            line-height: 1;
        }
        .archive-modal-content {
            max-width: 1100px;
            margin: 0 auto;
            min-height: calc(100vh - 68px);
            background: var(--charcoal-card);
            border: 1.5px solid var(--luxury-gold);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-lg);
            padding: 28px;
        }
        .archive-home .archive-modal-header {
            margin-bottom: 20px;
        }
        .archive-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            border-bottom: 1.5px solid var(--border-color);
            padding-bottom: 18px;
            margin-bottom: 22px;
        }
        .archive-modal-title {
            color: var(--luxury-gold);
            font-size: 1.7rem;
            font-weight: 800;
        }
        .archive-close-btn {
            width: 42px;
            height: 42px;
            padding: 0;
            border-radius: var(--border-radius);
            font-size: 1.4rem;
            line-height: 1;
        }
        .archive-search {
            margin-bottom: 22px;
        }
        .archive-search input {
            width: 100%;
            height: 52px;
            padding: 0 16px;
            border: 1.5px solid var(--border-color);
            border-radius: var(--border-radius);
            background: var(--soft-black-field);
            color: var(--text-ivory);
            font-family: 'Tajawal', sans-serif;
            font-size: 0.95rem;
            transition: var(--transition);
            outline: none;
            direction: rtl;
        }
        .archive-search input:focus {
            border-color: var(--luxury-gold);
            box-shadow: 0 0 0 4px var(--luxury-gold-glow);
        }
        .archive-search input::placeholder {
            color: var(--text-muted-beige);
            opacity: 0.65;
        }
        .archive-table-wrap {
            width: 100%;
            overflow: visible;
            border: 1.5px solid var(--border-color);
            border-radius: var(--border-radius);
        }
        .archive-table {
            width: 100%;
            min-width: 720px;
            border-collapse: collapse;
            direction: rtl;
        }
        .archive-table th,
        .archive-table td {
            padding: 15px 16px;
            text-align: right;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-ivory);
            font-size: 0.92rem;
        }
        .archive-table th {
            color: var(--luxury-gold);
            background: rgba(198, 167, 105, 0.07);
            font-weight: 800;
            white-space: nowrap;
        }
        .archive-table tbody tr:nth-child(even) {
            background: rgba(255, 255, 255, 0.025);
        }
        .archive-table tbody tr:nth-child(odd) {
            background: rgba(198, 167, 105, 0.025);
        }
        .archive-table tbody tr:hover {
            background: rgba(198, 167, 105, 0.08);
        }
        .archive-download-btn {
            width: auto;
            padding: 9px 18px;
            min-height: 38px;
            font-size: 0.85rem;
            white-space: nowrap;
        }
        .archive-row-actions {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 8px;
        }
        .archive-actions-menu {
            position: relative;
            flex: 0 0 auto;
        }
        .archive-actions-menu summary {
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            border: 1.5px solid var(--border-color);
            border-radius: var(--border-radius);
            color: var(--luxury-gold);
            background: transparent;
            cursor: pointer;
            font-size: 1.45rem;
            font-weight: 800;
            line-height: 1;
            list-style: none;
            user-select: none;
        }
        .archive-actions-menu summary::-webkit-details-marker {
            display: none;
        }
        .archive-actions-menu[open] summary {
            border-color: var(--luxury-gold);
            background: rgba(198, 167, 105, 0.08);
        }
        .archive-actions-menu[open] {
            z-index: 30;
        }
        .archive-actions-popover {
            position: absolute;
            z-index: 20;
            top: calc(100% + 7px);
            left: 0;
            min-width: 145px;
            padding: 6px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: #181817;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55);
        }
        .archive-delete-btn {
            width: 100%;
            padding: 9px 12px;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: #ef9a9a;
            font-family: inherit;
            font-size: 0.83rem;
            font-weight: 800;
            cursor: pointer;
            white-space: nowrap;
        }
        .archive-delete-btn:hover {
            background: rgba(239, 83, 80, 0.12);
        }
        .archive-empty {
            padding: 46px 20px;
            text-align: center;
            color: var(--text-muted-beige);
            border: 1.5px solid var(--border-color);
            border-radius: var(--border-radius);
            background: rgba(198, 167, 105, 0.03);
        }
        .delete-confirm-modal {
            position: fixed;
            inset: 0;
            z-index: 7000;
            display: none;
            place-items: center;
            padding: 20px;
            background: rgba(8, 8, 8, 0.86);
            backdrop-filter: blur(8px);
        }
        .delete-confirm-modal.open {
            display: grid;
        }
        .delete-confirm-card {
            width: min(420px, 100%);
            padding: 26px;
            border: 1.5px solid var(--luxury-gold);
            border-radius: var(--border-radius);
            background: var(--charcoal-card);
            box-shadow: var(--shadow-lg);
            text-align: center;
        }
        .delete-confirm-card h3 {
            margin-bottom: 10px;
            color: var(--luxury-gold);
            font-size: 1.3rem;
        }
        .delete-confirm-card p {
            margin-bottom: 22px;
            color: var(--text-muted-beige);
            line-height: 1.7;
        }

    <script>
        const { jsPDF } = window.jspdf;
        const adminTokenKey = 'eventQrAdminToken';
        const adminApiBase = window.location.hostname.endsWith('github.io')
            ? 'https://om-production-7de0.up.railway.app'
            : '';
        let adminOrders = [];
        let pendingDeleteInvoiceId = '';

        async function adminApi(path, options = {}) {
            const headers = { ...(options.headers || {}) };
            if (options.body) headers['Content-Type'] = 'application/json';
            const token = localStorage.getItem(adminTokenKey);
            if (token) headers.Authorization = `Bearer ${token}`;
            const response = await fetch(`${adminApiBase}${path}`, { ...options, headers });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.message || 'تعذر الاتصال بالخادم.');
            return data;
        }

        function setAdminMessage(text, isError = false) {
            const element = document.getElementById('admin-login-message');
            element.textContent = text;
            element.classList.toggle('error', isError);
        }

        function showAdminEmailForm() {
            document.getElementById('admin-email-form').classList.remove('hidden');
            document.getElementById('admin-code-form').classList.add('hidden');
            setAdminMessage('');
        }

        function adminLogout() {
            localStorage.removeItem(adminTokenKey);
            adminOrders = [];
            closeInvoiceModal();
            document.getElementById('admin-login').classList.remove('hidden');
            showAdminEmailForm();
        }

        function normalizeInvoiceLabel(label) {
            return String(label || '').replace(/_/g, ' ').replace(/\s+/g, ' ').trim();
        }

        function normalizeCouponPercent(value) {
            const clean = String(value || '').trim();
            if (!clean) return '';
            const numberMatch = clean.match(/-?\d+(?:\.\d+)?/);
            if (!numberMatch) return clean.startsWith('-') ? clean : `-${clean}`;
            const number = Math.abs(Number(numberMatch[0]));
            return Number.isFinite(number) ? `-${number}%` : '';
        }

        function isCouponPercentLabel(label) {
            return normalizeInvoiceLabel(label) === 'نسبة خصم الكود';
        }

        function isCouponValueLabel(label) {
            return normalizeInvoiceLabel(label) === 'قيمة خصم الكود';
        }

        function formatCouponDiscountValue(value, percent) {
            const discountValue = String(value ?? '').trim();
            const percentText = normalizeCouponPercent(percent);
            if (!percentText || discountValue.includes(percentText)) return discountValue;
            return `${discountValue} (${percentText})`;
        }

        function orderToInvoice(order) {
            const details = order.details && typeof order.details === 'object' ? order.details : {};
            const couponPercent = Object.entries(details).find(([key]) => isCouponPercentLabel(key))?.[1] || '';
            const visibleDetails = Object.entries(details)
                .filter(([key]) => {
                    const normalizedKey = normalizeInvoiceLabel(key);
                    return normalizedKey !== 'نوع العميل' && !isCouponPercentLabel(normalizedKey);
                })
                .map(([key, value]) => {
                    if (isCouponValueLabel(key)) {
                        return [key, formatCouponDiscountValue(value, couponPercent)];
                    }
                    return [key, value];
                });
            const rawData = [
                `رقم الطلب: ${order.order_number}`,
                `اسم العميل: ${order.customer_name}`,
                `رقم الجوال: ${order.customer_phone || '---'}`,
                ...visibleDetails.map(([key, value]) => `${key}: ${value}`),
                `السعر النهائي: ${Number(order.total_price).toFixed(3)} ${order.currency}`
            ].join('\n');
            return {
                id: order.order_number,
                orderId: order.order_number,
                customerName: order.customer_name,
                phone: order.customer_phone,
                createdAt: order.created_at,
                orderDateTime: new Intl.DateTimeFormat('ar-OM', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: 'numeric',
                    minute: '2-digit'
                }).format(new Date(order.created_at)),
                rawData,
                invoiceHTML: ''
            };

        function convertToEnglish(str) {
            if (!str) return str;
            const arabicDigits = [/\u0660/g, /\u0661/g, /\u0662/g, /\u0663/g, /\u0664/g, /\u0665/g, /\u0666/g, /\u0667/g, /\u0668/g, /\u0669/g];
            const persianDigits = [/\u06F0/g, /\u06F1/g, /\u06F2/g, /\u06F3/g, /\u06F4/g, /\u06F5/g, /\u06F6/g, /\u06F7/g, /\u06F8/g, /\u06F9/g];
            for (let i = 0; i < 10; i++) {
                str = str.replace(arabicDigits[i], i);
                str = str.replace(persianDigits[i], i);
            }
            return str;
        }

        function escapeHTML(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({

                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            }[char]));
        }

        function findFieldKey(rawKey) {
            const cleanedKey = rawKey
                .toLowerCase()
                .replace(/[()]/g, '')
                .replace(/_/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();

            const patterns = Object.entries(FIELD_MAP).sort((a, b) => b[0].length - a[0].length);
            for (const [keyPattern, fieldKey] of patterns) {
                if (cleanedKey.includes(keyPattern.toLowerCase())) {
                    return fieldKey;
                }
            }
            return null;
        }

        function parseRawInput(text) {
            const data = {
                orderId: '---',
                customerName: '---',
                phone: '---',
                customerEmail: '',
                eventType: '',
                invitationSize: '',
                invitationType: '',
                designType: '',
                eventDate: '',
                eventTime: '',
                location: '',
                weddingDetails: '',
                letters: '',
                writtenNames: '',
                templateNumber: '',
                securityGuard: '',
                themeColor: '',
                quantity: '',
                customDesign: '',
                finalPrice: '0.00 OMR',
                notes: '',
                extraFields: []
            };

            if (!text || !text.trim()) return data;

            let normalized = convertToEnglish(text);
            normalized = normalized.replace(/\t/g, ' ');
            const lines = normalized.split(/\n|\r/).map(l => l.trim()).filter(Boolean);
            let hasExplicitFinalPrice = false;
            const setParsedField = (fieldKey, value) => {
                data[fieldKey] = value;
                if (fieldKey === 'finalPrice') hasExplicitFinalPrice = true;
            };
            
            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (!line) continue;

                let matched = false;
                const separatorMatch = line.match(/^(.+?)\s*[:：=]\s*(.+)$/);
                if (separatorMatch) {
                    const rawKey = separatorMatch[1].trim();
                    let value = separatorMatch[2].trim();
                    const fieldKey = findFieldKey(rawKey);
                    if (fieldKey && value) {
                        setParsedField(fieldKey, value);
                        matched = true;
                    } else if (/^(subject|from_name|access_key|botcheck|---|رابط_الفاتورة)$/i.test(rawKey)) {
                        matched = true;
                    } else if (value) {
                        data.extraFields.push({
                            label: rawKey.replace(/_/g, ' ').trim(),
                            value
                        });
                        matched = true;
                    }
                }

                if (!matched) {
                    const exactFieldKey = findFieldKey(line);
                    if (exactFieldKey) {
                        const value = lines[i + 1] && !findFieldKey(lines[i + 1]) ? lines[i + 1].trim() : '';
                        if (value) {
                            setParsedField(exactFieldKey, value);
                            i++;
                            matched = true;
                        }
                    }
                }

                if (!matched) {
                    const lowerLine = line.toLowerCase();
                    for (const [keyPattern, fieldKey] of Object.entries(FIELD_MAP)) {
                        const lowerPattern = keyPattern.toLowerCase();
                        if (lowerLine.includes(lowerPattern)) {
                            let value = line.substring(lowerLine.indexOf(lowerPattern) + keyPattern.length).trim();
                            value = value.replace(/^[:：=\-\s]+/, '').trim();
                            if (!value && lines[i + 1] && !findFieldKey(lines[i + 1])) {
                                value = lines[i + 1].trim();
                                i++;
                            }
                            if (value) setParsedField(fieldKey, value);
                            break;
                        }
                    }
                }
            }

            const colorRegex = /#([0-9A-Fa-f]{6}|[0-9A-Fa-f]{3})/g;
            const colors = [];
            let m;
            while ((m = colorRegex.exec(text)) !== null) {
                colors.push('#' + m[1]);
            }
            if (colors.length > 0) {
                data.themeColor = colors[0];
            }

            const priceRegex = /(\d+\.?\d*)\s*(OMR|ر\.ع|ريال|OMR)/i;
            const priceMatch = text.match(priceRegex);
            if (!hasExplicitFinalPrice && priceMatch) {
                data.finalPrice = priceMatch[1] + ' ' + (priceMatch[2] || 'OMR');
            }

            const phoneRegex = /\+?968\s*\d{8}|\+?968\s*[\d\s]{8,12}/;
            const phoneMatch = text.match(phoneRegex);
            if (phoneMatch) {
                data.phone = phoneMatch[0];
            }

            const dateRegex = /(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/;
            const dateMatch = text.match(dateRegex);
            if (dateMatch) {
                data.eventDate = dateMatch[1].padStart(2,'0') + '-' + dateMatch[2].padStart(2,'0') + '-' + dateMatch[3];
            }

            const orderRegex = /((?:EQR|ORD)-[\w-]+|(?=[A-Z0-9]{8}\b)(?=[A-Z0-9]*[A-Z])(?=[A-Z0-9]*\d)[A-Z0-9]{8})/i;
            const orderMatch = text.match(orderRegex);
            if (orderMatch) {
                data.orderId = orderMatch[1];
            }

            return data;
        }

        function waitForInvoiceImages(element) {
            const images = Array.from(element.querySelectorAll('img'));
            if (!images.length) return Promise.resolve();

            const imagePromises = images.map(img => {
                if (img.complete && img.naturalWidth > 0) return Promise.resolve();

                return new Promise(resolve => {
                    const finish = () => resolve();
                    img.addEventListener('load', finish, { once: true });
                    img.addEventListener('error', finish, { once: true });
                    setTimeout(finish, 3000);
                });
            });

            return Promise.all(imagePromises);
        }

        async function saveElementAsPDF(element, fileName) {
            element.classList.add('pdf-compact');
            await new Promise(resolve => requestAnimationFrame(resolve));
            await waitForInvoiceImages(element);

            const canvas = await html2canvas(element, {
                scale: 3,
                useCORS: false,
                allowTaint: false,
                backgroundColor: '#ffffff',
                logging: false,
                imageTimeout: 3000,
                windowWidth: element.scrollWidth,
                windowHeight: element.scrollHeight
            });

            const imgData = canvas.toDataURL('image/png');
            
            const imgWidth = canvas.width;
            const imgHeight = canvas.height;
            
            const mmPerPx = 25.4 / 96;
            const pdfWidth = imgWidth * mmPerPx;
            const pdfHeight = imgHeight * mmPerPx;

            const pdf = new jsPDF({
                orientation: pdfWidth > pdfHeight ? 'landscape' : 'portrait',
                unit: 'mm',
                format: [pdfWidth, pdfHeight]
            });

            pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
            pdf.save(fileName + '.pdf');
        }

        async function downloadPDF() {
            const element = document.getElementById('invoice-to-print');
            if (!element) {
                showToast('يرجى إنشاء الفاتورة أولاً');
                return;
            }

            showToast('جاري إنشاء PDF...');

            try {
                const orderId = (document.getElementById('raw-input').value.match(/((?:EQR|ORD)-[\w-]+|(?=[A-Z0-9]{8}\b)(?=[A-Z0-9]*[A-Z])(?=[A-Z0-9]*\d)[A-Z0-9]{8})/i) || ['invoice'])[0];
                await saveElementAsPDF(element, orderId);
                showToast('تم التحميل بنجاح');
            } catch (err) {
                console.error(err);
                showToast('حدث خطأ، جرب الطباعة');
            } finally {
                element.classList.remove('pdf-compact');
            }
        }

        function renderArchiveTable() {
            const content = document.getElementById('archive-content');
            const searchValue = (document.getElementById('archive-search-input').value || '').trim().toLowerCase();
            const invoices = getSavedInvoices();
            const filteredInvoices = invoices
                .filter(invoice => {
                    const orderId = String(getArchivedOrderId(invoice)).toLowerCase();
                    const phone = String(invoice.phone || '').toLowerCase();
                    return orderId.includes(searchValue) || phone.includes(searchValue);
                })
                .sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));

            if (!invoices.length) {
                content.innerHTML = '<div class="archive-empty">لا توجد فواتير محفوظة بعد</div>';
                return;
            }

            if (!filteredInvoices.length) {
                content.innerHTML = '<div class="archive-empty">لا توجد نتائج مطابقة</div>';
                return;
            }

            const rows = filteredInvoices.map(invoice => `
                <tr>
                    <td dir="ltr" style="text-align:right;">${escapeHTML(getArchivedOrderId(invoice))}</td>
                    <td dir="ltr" style="text-align:right;">${escapeHTML(invoice.phone || '---')}</td>

                    <td>

                                </div>
                            </details>
                        </div>
                    </td>
                </tr>
            `).join('');

            content.innerHTML = `
                <div class="archive-table-wrap">
                    <table class="archive-table">
                        <thead>
                            <tr>

                                <th>رقم هاتف العميل</th>

            `;

        async function downloadArchivedInvoice(encodedInvoiceId) {
            const invoiceId = decodeURIComponent(encodedInvoiceId);
            const invoice = getSavedInvoices().find(item => item.id === invoiceId);

            if (!invoice || !invoice.rawData) {
                showToast('تعذر العثور على الفاتورة');
                return;

            document.getElementById('raw-input').value = invoice.rawData;
            generateInvoice();
            openInvoiceModal();
        }

            modal.classList.add('open');

        async function confirmDeleteArchivedInvoice() {
            const invoiceId = pendingDeleteInvoiceId;
            if (!invoiceId) return;
            const submitButton = document.getElementById('delete-confirm-submit');
            submitButton.disabled = true;
            submitButton.textContent = 'جاري الحذف...';
            try {
                await adminApi(`/api/admin/orders/${encodeURIComponent(invoiceId)}`, { method: 'DELETE' });
                adminOrders = adminOrders.filter(invoice => invoice.id !== invoiceId);
                closeDeleteConfirm();
                renderArchiveTable();
                showToast('تم حذف الفاتورة');
            } catch (error) {
                showToast(error.message || 'تعذر حذف الفاتورة');
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = 'حذف الفاتورة';
            }
        }

        document.addEventListener('keydown', function(event) {
            if (event.key !== 'Escape') return;
            if (document.getElementById('delete-confirm-modal').classList.contains('open')) {
                closeDeleteConfirm();
                return;
            }
            closeInvoiceModal();
        });

        document.addEventListener('click', function(event) {
            document.querySelectorAll('.archive-actions-menu[open]').forEach(menu => {
                if (!menu.contains(event.target)) menu.removeAttribute('open');
            });
        });

        document.getElementById('invoice-modal').addEventListener('click', function(event) {
            if (event.target === this) closeInvoiceModal();
        });

        document.getElementById('delete-confirm-modal').addEventListener('click', function(event) {
            if (event.target === this) closeDeleteConfirm();
        });

        function printInvoice() {
            const element = document.getElementById('invoice-to-print');
            if (!element) {
                showToast('يرجى إنشاء الفاتورة أولاً');
                return;
            }
            window.print();
        }

        (async function initializeAdmin() {
            if (!localStorage.getItem(adminTokenKey)) return;
            try {
                await loadAdminOrders();
            } catch {
                adminLogout();
            }
        })();
    </script>
</body>
</html>
